server:
  port: ${PORT:8082}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reto_plazoleta}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

feign-url:
  users: ${USER_URL:http://localhost:8081}/api/v1
  owners: ${feign-url.users}/owners
  employees: ${feign-url.users}/users/employees
  customers: ${feign-url.users}/users
  mensajeria: ${MENSAJERIA_URL:http://localhost:8083}/api/v1/notifications
  traceability: ${TRACE_URL:http://localhost:8084}/api/v1/traceability

jwt:
  secret: ${JWT_SECRET:una-clave-secreta-de-al-menos-32-bytes}

appDescription: "Plazoleta api"
appVersion: "1.0.0"
